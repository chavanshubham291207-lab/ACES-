services:
  # Backend Node.js API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aces_backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=5000
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - aces_network
    restart: always

  # Frontend React SPA + Nginx Web Server Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aces_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - aces_network
    restart: always

networks:
  aces_network:
    driver: bridge

volumes:
  backend_uploads:
