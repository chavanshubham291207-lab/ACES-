services:
  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aces_backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - backend_uploads:/app/uploads
    env_file:
      - ./backend/.env
    environment:
      - PORT=5000
      - NODE_ENV=development
    restart: unless-stopped

  # Frontend React (Vite) Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aces_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_PROXY_TARGET=http://backend:5000
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    depends_on:
      - backend
    restart: unless-stopped

  # Optional Local MongoDB Database Service (Use --profile with-local-db to activate)
  mongodb:
    image: mongo:6-alpine
    container_name: aces_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=aces
    profiles:
      - with-local-db
    restart: unless-stopped

volumes:
  backend_uploads:
  mongo_data:
